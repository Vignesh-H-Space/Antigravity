<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile | Tesseract</title>
  <meta name="description" content="Personal Profile, Streak Milestones, Badges, and Activity in Tesseract.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar Mount Point -->
    <div id="sidebar-mount"></div>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Header Mount Point -->
      <div id="header-mount"></div>

      <!-- Profile Page View -->
      <section class="profile-view" id="profile-container">
        <div class="profile-hero">
          <button class="profile-back-btn" id="btn-profile-back" onclick="window.location.href='index.html'">
            <i data-lucide="arrow-left"></i>
            <span>Back to Dashboard</span>
          </button>
          <div class="profile-hero-inner">
            <div class="profile-avatar-large" id="profile-avatar-large" title="Click to change photo">
              <img id="profile-avatar-img" src="" alt="" style="display:none; width:100%; height:100%; object-fit:cover; border-radius:50%;">
              <i data-lucide="user" id="profile-avatar-fallback"></i>
              <div class="avatar-overlay"><i data-lucide="camera"></i></div>
            </div>
            <input type="file" id="profile-image-input" accept="image/*" style="display:none;">
            <div class="profile-hero-info">
              <div class="profile-name-row">
                <h2 class="profile-name" id="profile-name">Tesseract User</h2>
                <button class="profile-edit-name-btn" id="btn-edit-name" title="Edit name"><i data-lucide="pencil"></i></button>
              </div>
              <p class="profile-tagline" id="profile-tagline">Starter</p>
              <div class="profile-joined">
                <i data-lucide="calendar"></i>
                <span id="profile-joined-date">Member since —</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Stats Row -->
        <div class="profile-stats-row" id="profile-stats-row">
          <div class="profile-stat-card">
            <div class="profile-stat-value" id="pstat-total-tasks">0</div>
            <div class="profile-stat-label">Total Tasks</div>
          </div>
          <div class="profile-stat-card">
            <div class="profile-stat-value" id="pstat-completed">0</div>
            <div class="profile-stat-label">Completed</div>
          </div>
          <div class="profile-stat-card">
            <div class="profile-stat-value" id="pstat-completion-rate">0%</div>
            <div class="profile-stat-label">Completion Rate</div>
          </div>
          <div class="profile-stat-card accent">
            <div class="profile-stat-value" id="pstat-streak">0</div>
            <div class="profile-stat-label">Day Streak 🔥</div>
          </div>
          <div class="profile-stat-card">
            <div class="profile-stat-value" id="pstat-best-streak">0</div>
            <div class="profile-stat-label">Best Streak</div>
          </div>
          <div class="profile-stat-card">
            <div class="profile-stat-value" id="pstat-deep-work">0h</div>
            <div class="profile-stat-label">Deep Work Logged</div>
          </div>
        </div>

        <!-- Badge Showcase -->
        <div class="profile-section-card">
          <h3 class="profile-section-title"><i data-lucide="award"></i> Badge Collection</h3>
          <p class="profile-section-sub">Earn badges by maintaining your daily streak. Complete all daily tasks to keep it alive.</p>
          <div class="profile-badge-showcase" id="profile-badge-showcase">
            <!-- Injected by JS -->
          </div>
        </div>

        <!-- Per-Horizon Breakdown -->
        <div class="profile-section-card">
          <h3 class="profile-section-title"><i data-lucide="layers"></i> Horizon Breakdown</h3>
          <div class="profile-horizon-breakdown" id="profile-horizon-breakdown">
            <!-- Injected by JS -->
          </div>
        </div>

        <!-- Recent Activity -->
        <div class="profile-section-card">
          <h3 class="profile-section-title"><i data-lucide="activity"></i> Recent Activity</h3>
          <div class="profile-activity-list" id="profile-activity-list">
            <!-- Injected by JS -->
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/components.js"></script>
  <script src="js/initial_data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
