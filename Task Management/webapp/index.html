<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tesseract | Multi-Horizon Goal & Task Matrix</title>
  <meta name="description" content="Tesseract: Multi-dimensional goal & task management across Daily, Weekly, Monthly, Quarterly, and Annual horizons with cascading alignment.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Canvas Confetti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="app-layout">
    <!-- Sidebar Mount Point -->
    <div id="sidebar-mount"></div>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Header Mount Point -->
      <div id="header-mount"></div>

      <!-- Horizon Progress Summary Cards -->
      <section class="progress-summary-grid" id="progress-summary-container">
        <!-- Daily -->
        <div class="horizon-card" data-horizon="daily">
          <div class="horizon-card-top">
            <div class="horizon-badge tier-daily">🌅 Daily</div>
            <span class="horizon-ratio" id="stat-ratio-daily">0/0</span>
          </div>
          <div class="horizon-card-body">
            <div class="horizon-pct" id="stat-pct-daily">0%</div>
            <div class="progress-track">
              <div class="progress-bar-fill fill-daily" id="stat-bar-daily" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <!-- Weekly -->
        <div class="horizon-card" data-horizon="weekly">
          <div class="horizon-card-top">
            <div class="horizon-badge tier-weekly">📅 Weekly</div>
            <span class="horizon-ratio" id="stat-ratio-weekly">0/0</span>
          </div>
          <div class="horizon-card-body">
            <div class="horizon-pct" id="stat-pct-weekly">0%</div>
            <div class="progress-track">
              <div class="progress-bar-fill fill-weekly" id="stat-bar-weekly" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <!-- Monthly -->
        <div class="horizon-card" data-horizon="monthly">
          <div class="horizon-card-top">
            <div class="horizon-badge tier-monthly">🗓️ Monthly</div>
            <span class="horizon-ratio" id="stat-ratio-monthly">0/0</span>
          </div>
          <div class="horizon-card-body">
            <div class="horizon-pct" id="stat-pct-monthly">0%</div>
            <div class="progress-track">
              <div class="progress-bar-fill fill-monthly" id="stat-bar-monthly" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <!-- Quarterly (hidden by default in General view) -->
        <div class="horizon-card" data-horizon="quarterly" style="display:none;">
          <div class="horizon-card-top">
            <div class="horizon-badge tier-quarterly">🎯 Quarterly</div>
            <span class="horizon-ratio" id="stat-ratio-quarterly">0/0</span>
          </div>
          <div class="horizon-card-body">
            <div class="horizon-pct" id="stat-pct-quarterly">0%</div>
            <div class="progress-track">
              <div class="progress-bar-fill fill-quarterly" id="stat-bar-quarterly" style="width: 0%"></div>
            </div>
          </div>
        </div>

        <!-- Annual (hidden by default in General view) -->
        <div class="horizon-card" data-horizon="annual" style="display:none;">
          <div class="horizon-card-top">
            <div class="horizon-badge tier-annual">🏆 Annual</div>
            <span class="horizon-ratio" id="stat-ratio-annual">0/0</span>
          </div>
          <div class="horizon-card-body">
            <div class="horizon-pct" id="stat-pct-annual">0%</div>
            <div class="progress-track">
              <div class="progress-bar-fill fill-annual" id="stat-bar-annual" style="width: 0%"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- Filter Controls Bar -->
      <div class="filter-bar">
        <div class="filter-group">
          <span class="filter-label">Horizon:</span>
          <select class="custom-select" id="horizon-select-filter">
            <option value="general">🏠 Home (Daily, Weekly, Monthly)</option>
            <option value="daily">🌅 Daily Tasks</option>
            <option value="weekly">📅 Weekly Milestones</option>
            <option value="monthly">🗓️ Monthly Goals</option>
            <option value="quarterly">🎯 Quarterly Goals</option>
            <option value="annual">🏆 Annual Vision</option>
            <option value="all">🌐 All 5 Horizons</option>
          </select>
        </div>

        <div class="filter-group">
          <span class="filter-label">Status:</span>
          <div class="segmented-control" id="status-filter">
            <button class="segment active" data-status="all">All</button>
            <button class="segment" data-status="active">Incomplete</button>
            <button class="segment" data-status="completed">Completed</button>
          </div>
        </div>

        <div class="filter-group">
          <span class="filter-label">Category:</span>
          <select class="custom-select" id="category-filter">
            <option value="all">All Categories</option>
            <option value="Product">Product</option>
            <option value="Engineering">Engineering</option>
            <option value="Career">Career</option>
            <option value="Finance">Finance</option>
            <option value="Health">Health</option>
            <option value="Personal">Personal</option>
          </select>
        </div>

        <div class="filter-group">
          <span class="filter-label">Priority:</span>
          <select class="custom-select" id="priority-filter">
            <option value="all">All Priorities</option>
            <option value="urgent">Urgent</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>

        <div class="filter-actions">
          <button class="btn btn-ghost btn-sm" id="btn-export-markdown" title="Copy Markdown Summary to Clipboard">
            <i data-lucide="clipboard-copy"></i>
            <span>Export Markdown</span>
          </button>
        </div>
      </div>

      <!-- Main Tasks List Container -->
      <section class="task-list-view" id="tasks-container">
        <!-- Injected via JavaScript -->
      </section>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/components.js"></script>
  <script src="js/initial_data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
